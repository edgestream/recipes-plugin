name: Container

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: docker build --platform linux/arm64 --build-arg VCS_REF=${{ github.sha }} --tag recipes-mcp-smoke:${{ github.sha }} .
      - run: node scripts/container-smoke.mjs recipes-mcp-smoke:${{ github.sha }} ${{ github.sha }}
