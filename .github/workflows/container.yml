name: Container

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: docker build --platform linux/arm64 --build-arg VCS_REF=${{ github.sha }} --tag recipes-mcp-smoke:${{ github.sha }} .
      - run: node scripts/container-smoke.mjs recipes-mcp-smoke:${{ github.sha }} ${{ github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/edgestream/recipes-mcp:${{ github.sha }}
          build-args: VCS_REF=${{ github.sha }}
          provenance: mode=max
      - if: github.event_name != 'pull_request'
        run: echo "Published ghcr.io/edgestream/recipes-mcp@${{ steps.publish.outputs.digest }} for ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
